version: 0.2

env:
  variables:
    REGION: us-east-1
    CLUSTER_NAME: devops-cluster
    REPOSITORY_URI: 779846799257.dkr.ecr.us-east-1.amazonaws.com/react-app-repo
    # Add a variable for the EKS version to make the buildspec more maintainable
    EKS_K8S_VERSION: 1.29 # Use a stable version supported by your EKS cluster

phases:
  install:
    commands:
      - echo "Installing kubectl and aws-iam-authenticator for EKS version $EKS_K8S_VERSION..."

      # 1. Install kubectl (using a stable version path)
      - curl -LO "https://dl.k8s.io/release/v$EKS_K8S_VERSION.0/bin/linux/amd64/kubectl"
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/kubectl

      # 2. Install aws-iam-authenticator (using a versioned path)
      - curl -LO "https://github.com/kubernetes-sigs/aws-iam-authenticator/releases/download/v0.6.14/aws-iam-authenticator_0.6.14_linux_amd64"
      - mv aws-iam-authenticator_0.6.14_linux_amd64 aws-iam-authenticator
      - chmod +x aws-iam-authenticator
      - mv aws-iam-authenticator /usr/local/bin/aws-iam-authenticator

      - echo "Logging into Amazon ECR..."
      - aws ecr get-login-password --region $REGION | docker login --username AWS --password-stdin $REPOSITORY_URI

      - echo "Verifying kubectl installation..."
      - kubectl version --client

  pre_build:
    commands:
      - echo "Preparing build environment..."
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo IMAGE_TAG=$IMAGE_TAG
      - export IMAGE_TAG

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:latest

  post_build:
    commands:
      - echo "Pushing Docker images to ECR..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG
      - docker push $REPOSITORY_URI:latest

      - echo "Configuring kubectl for EKS..."
      - aws eks update-kubeconfig --name $CLUSTER_NAME --region $REGION

      - echo "Replacing image tag in manifests..."
      - sed -i "s|IMAGE_URI|$REPOSITORY_URI:$IMAGE_TAG|g" k8s/*.yaml

      - echo "Deploying to EKS..."
      - kubectl apply -f k8s/
