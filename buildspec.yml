version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "react-app-repo"
    AWS_DEFAULT_REGION: "us-east-1"
    CLUSTER_NAME: "react-app-cluster"
    K8S_FOLDER: "k8s"

phases:
  install:
    commands:
      - echo "Installing kubectl and aws-iam-authenticator..."
      - curl -LO https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
      - chmod +x ./kubectl && mv ./kubectl /usr/local/bin/
      - curl -Lo aws-iam-authenticator https://amazon-eks.s3.us-west-2.amazonaws.com/1.29.0/2024-06-14/bin/linux/amd64/aws-iam-authenticator
      - chmod +x aws-iam-authenticator && mv aws-iam-authenticator /usr/local/bin/
      - echo "✅ Installation complete"

  pre_build:
    commands:
      - echo "🔑 Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin 779846799257.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - echo "🏷️ Setting image tag from commit ID..."
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - echo "IMAGE_TAG=$IMAGE_TAG"

  build:
    commands:
      - echo "🏗️ Building Docker image..."
      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .

      - echo "🏷️ Tagging image for ECR..."
      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG 779846799257.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

      - echo "📦 Pushing image to ECR..."
      - docker push 779846799257.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

      - echo "✅ Image pushed successfully."

  post_build:
    commands:
      - echo "🔗 Connecting to EKS cluster..."
      - aws eks update-kubeconfig --region $AWS_DEFAULT_REGION --name $CLUSTER_NAME

      - echo "📝 Updating image tag in deployment.yaml..."
      - 'sed -i "s|image: .*|image: 779846799257.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com/${IMAGE_REPO_NAME}:${IMAGE_TAG}|g" ${K8S_FOLDER}/deployment.yaml'

      - echo "🚀 Applying all Kubernetes manifests..."
      - kubectl apply -f $K8S_FOLDER/

      - echo "⏳ Waiting for deployment rollout..."
      - kubectl rollout status deployment/react-frontend || true

      - echo "✅ All Kubernetes manifests applied successfully!"
      - kubectl get all

      # 🎯 NEW SECTION - print LoadBalancer URL
      - echo "🌐 Fetching LoadBalancer URL..."
      - |
        EXTERNAL_IP=$(kubectl get svc react-frontend-service -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
        if [ -z "$EXTERNAL_IP" ]; then
          echo "❌ No LoadBalancer URL found yet. It might take 1–2 minutes for AWS to allocate it."
        else
          echo "✅ Your React app is live at: http://$EXTERNAL_IP"
        fi
