version: 0.2

env:
  variables:
    REGION: us-east-1
    CLUSTER_NAME: react-eks-cluster
    REPOSITORY_URI: 779846799257.dkr.ecr.us-east-1.amazonaws.com/react-app-repo

phases:
  install:
    commands:
      - echo Installing kubectl...
      - curl -o kubectl https://amazon-eks.s3.us-east-1.amazonaws.com/1.29.0/2024-01-04/bin/linux/amd64/kubectl
      - chmod +x kubectl
      - mv kubectl /usr/local/bin/

  pre_build:
    commands:
      - echo Updating kubeconfig...
      - aws eks update-kubeconfig --region $REGION --name $CLUSTER_NAME
      - IMAGE_TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - export IMAGE_TAG

  build:
    commands:
      - echo Deploying to EKS...
      - sed -i "s|<IMAGE_TAG>|$IMAGE_TAG|g" k8s/deployment.yaml
      - kubectl apply -f k8s/
