apiVersion: v1
kind: Service
metadata:
  name: react-frontend-service                # ✅ matches deployment naming
  labels:
    app: react-frontend
spec:
  type: ClusterIP                             # ✅ internal access (can change to LoadBalancer later)
  selector:
    app: react-frontend                       # ✅ must match Deployment's label
  ports:
    - port: 80                                # Service port
      targetPort: 80                          # Container port
