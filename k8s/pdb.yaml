apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: react-frontend-pdb                  # ✅ consistent naming
  namespace: dev
  labels:
    app: react-frontend
spec:
  minAvailable: 2                           # ✅ ensures at least 2 Pods stay running
  selector:
    matchLabels:
      app: react-frontend                   # ✅ must match Deployment label
