apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: react-frontend-ingress                   # ✅ updated for consistency
  labels:
    app: react-frontend
  annotations:
    kubernetes.io/ingress.class: nginx           # ✅ for NGINX ingress controller
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: react-frontend-service     # ✅ matches service.yaml
                port:
                  number: 80
